<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food Vocabulary</title>
<link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
<style>
  :root{
    --bg:#0f1116;
    --card:#1a1d27;
    --border:#2b2f3a;
    --text:#e8e9ee;
    --muted:#9aa0ad;
    --accent:#5b8def;
    --green:#2fbf71;
    --green-bg:#12321f;
    --green-text:#c9f6dc;
    --red:#e6534a;
    --red-bg:#3a1616;
    --red-text:#ffd0cc;
    --input-bg:#12141b;
  }
  html[data-theme="light"]{
    --bg:#f4f5f8;
    --card:#ffffff;
    --border:#dfe2ea;
    --text:#1b1d24;
    --muted:#6b7180;
    --accent:#3763d6;
    --green:#1f9d5c;
    --green-bg:#e4f8ec;
    --green-text:#0f5c33;
    --red:#d63c33;
    --red-bg:#fdeceb;
    --red-text:#8a231c;
    --input-bg:#f9f9fb;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:24px 16px 60px;
    transition:background .2s, color .2s;
  }
  .wrap{max-width:760px;margin:0 auto;}
  h1{text-align:center;font-size:1.5rem;margin-bottom:4px;}
  .sub{text-align:center;color:var(--muted);font-size:0.9rem;margin-bottom:20px;}
  .top-bar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5;
    border-bottom:1px solid var(--border);margin-bottom:16px;
  }
  #timer{
    font-size:1.3rem;font-weight:700;padding:6px 14px;border-radius:8px;
    background:var(--card);border:1px solid var(--border);min-width:80px;text-align:center;
  }
  #timer.warn{color:var(--red);border-color:var(--red);}
  #score{font-size:1rem;color:var(--muted);}
  #theme-toggle{
    background:var(--card);color:var(--text);border:1px solid var(--border);
    padding:6px 12px;border-radius:8px;font-size:0.85rem;cursor:pointer;
  }
  .item{
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:14px 16px;margin-bottom:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  }
  .ru{flex:1 1 260px;font-size:1rem;}
  input.answer{
    flex:1 1 240px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);
    background:var(--input-bg);color:var(--text);font-size:0.95rem;outline:none;
    font-family:inherit;transition:background .15s,border-color .15s;
  }
  input.answer:focus{border-color:var(--accent);}
  input.answer.correct{background:var(--green-bg);border-color:var(--green);color:var(--green-text);}
  input.answer.incorrect{background:var(--red-bg);border-color:var(--red);color:var(--red-text);}
  input.answer:disabled{opacity:0.8;}
  /* Correct answers are in the markup but stay hidden until the pop-up is closed after time is up */
  .reveal{display:none;flex-basis:100%;font-size:0.9rem;color:var(--green-text);
    background:var(--green-bg);border:1px solid var(--green);border-radius:8px;padding:6px 10px;}
  body.show-answers .reveal{display:block;}
  #check-btn{
    display:block;width:100%;background:var(--accent);color:#fff;border:none;
    padding:13px 18px;border-radius:10px;font-size:1rem;font-weight:600;
    cursor:pointer;margin-top:16px;
  }
  #check-btn:hover{opacity:0.9;}
  #check-btn:disabled{opacity:0.5;cursor:not-allowed;}
  #finish-overlay{
    display:none;position:fixed;inset:0;background:rgba(10,11,15,0.55);
    align-items:center;justify-content:center;z-index:20;
  }
  #finish-box{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:28px 30px;text-align:center;max-width:340px;color:var(--text);
  }
  #finish-emoji{font-size:3rem;line-height:1;margin-bottom:6px;}
  #finish-box h2{margin-top:0;margin-bottom:4px;}
  #finish-box p{color:var(--muted);}
  button.primary{
    background:var(--accent);color:#fff;border:none;padding:10px 24px;
    border-radius:8px;font-size:0.95rem;cursor:pointer;margin-top:10px;
  }
  button.primary:hover{opacity:0.9;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Food Vocabulary</h1>
  <p class="sub">Type the English equivalent of each Russian word or phrase, then press Check. You have 5 minutes.</p>

  <div class="top-bar">
    <div id="timer">05:00</div>
    <div id="score">0 / 30 correct</div>
    <button id="theme-toggle" onclick="toggleTheme()">🌙 Dark</button>
  </div>

  <div id="quiz"></div>
  <button id="check-btn" onclick="checkAll()">Check</button>
</div>

<div id="finish-overlay">
  <div id="finish-box">
    <div id="finish-emoji">🍴</div>
    <h2 id="finish-title">Time's up!</h2>
    <p id="final-score"></p>
    <button class="primary" onclick="closePopup()">OK</button>
  </div>
</div>

<script>
const baseData = [
  { ru: "Палочки для еды", answers: ["chopsticks"] },
  { ru: "Кислый", answers: ["sour"] },
  { ru: "Горький", answers: ["bitter"] },
  { ru: "Тесто", answers: ["dough"] },
  { ru: "Растворимый кофе", answers: ["instant coffee"] },
  { ru: "Лапша быстрого приготовления", answers: ["instant noodles"] },
  { ru: "Гречка", answers: ["buckwheat"] },
  { ru: "Углеводы", answers: ["carbohydrates", "carbs"] },
  { ru: "Жиры", answers: ["fats"] },
  { ru: "Белки", answers: ["protein"] },
  { ru: "Клетчатка", answers: ["fiber", "fibre"] },
  { ru: "Состав еды / блюда (1 слово)", answers: ["ingredients"] },
  { ru: "Тушить", answers: ["to stew"] },
  { ru: "Натереть на тёрке (1 слово)", answers: ["to grate"] },
  { ru: "Петрушка", answers: ["parsley"] },
  { ru: "Укроп", answers: ["dill"] },
  { ru: "Приправы", answers: ["seasonings", "seasoning", "herbs", "spices"] },
  { ru: "Заправка для салата", answers: ["salad dressing", "dressing"] },
  { ru: "Богат витамином А / с высоким содержанием A", answers: ["rich in vitamin A", "high in vitamin A"] },
  { ru: "Калорийный", answers: ["high-calorie", "high in calories", "calorie-dense"] },
  { ru: "Приборы для еды", answers: ["cutlery", "silverware"] },
  { ru: "Приём пищи", answers: ["a meal"] },
  { ru: "Порция", answers: ["a portion", "a serving"] },
  { ru: "Питательный", answers: ["nutritious"] },
  { ru: "Питательные вещества", answers: ["nutrients"] },
  { ru: "Пресный (безвкусный)", answers: ["bland"] },
  { ru: "Хрустящий", answers: ["crunchy", "crispy"] },
  { ru: "Уксус", answers: ["vinegar"] },
  { ru: "Выпечка", answers: ["pastry"] },
  { ru: "Молочные продукты", answers: ["dairy", "dairy products"] }
];

// Fisher-Yates shuffle: new order on every page load
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const data = shuffle(baseData);

const scoreMessages = {
  30: ["🍽️", "Michelin-star perfect!"],
  29: ["👨‍🍳", "Chef's kiss!"],
  28: ["🍰", "Absolutely delicious!"],
  27: ["🥇", "Gourmet-level work!"],
  26: ["🍣", "Beautifully done!"],
  25: ["🥂", "Cheers to you!"],
  24: ["🍓", "Fresh and flawless!"],
  23: ["🍕", "Top slice!"],
  22: ["🍜", "Hot and satisfying!"],
  21: ["🥑", "Rich and well-seasoned!"],
  20: ["🍪", "Sweet result!"],
  19: ["🍇", "Ripe and ready!"],
  18: ["🥐", "Nicely baked!"],
  17: ["🌮", "Tasty effort!"],
  16: ["🍔", "Hearty work!"],
  15: ["🥗", "Fresh and balanced!"],
  14: ["🧀", "Getting mature!"],
  13: ["🍞", "Rising nicely!"],
  12: ["🍯", "A taste of success!"],
  11: ["🥕", "Growing well!"],
  10: ["🍋", "A little zest to add!"],
  9:  ["🥖", "Almost out of the oven!"],
  8:  ["🍳", "Still cooking!"],
  7:  ["🥔", "Keep simmering!"],
  6:  ["🍲", "Needs a little more time!"],
  5:  ["🧂", "Add a pinch more practice!"],
  4:  ["🥣", "Mixing it up!"],
  3:  ["🥜", "A small start!"],
  2:  ["🥄", "A small taste to begin!"],
  1:  ["🥫", "Time to restock the pantry!"],
  0:  ["🍴", "Back to the kitchen!"]
};

// Case-insensitive; hyphens count as spaces; a leading "to" and a leading article
// (a / an / the) are optional. Spelling must otherwise be exact.
function normalize(str){
  let s = str.toLowerCase().replace(/[’‘]/g, "'");
  s = s.replace(/-/g, " ").replace(/[.,!?;:"()']/g, "");
  s = s.replace(/\s+/g, " ").trim();
  s = s.replace(/^to\s+/, "");
  s = s.replace(/^(a|an|the)\s+/, "");
  return s.trim();
}

const quizEl = document.getElementById("quiz");
let correctCount = 0;
let timeLeft = 300; // 5 minutes
let timerId = null;
const inputs = [];

data.forEach((item, idx) => {
  const row = document.createElement("div");
  row.className = "item";

  const ru = document.createElement("div");
  ru.className = "ru";
  ru.textContent = (idx + 1) + ". " + item.ru;

  const input = document.createElement("input");
  input.type = "text";
  input.className = "answer";
  input.autocomplete = "off";
  input.autocapitalize = "off";
  input.spellcheck = false;
  input.placeholder = "Type in English...";

  // Hidden until the pop-up is closed after time is up
  const reveal = document.createElement("div");
  reveal.className = "reveal";
  reveal.textContent = "Correct answer: " + item.answers.join(" OR ");

  // No live validation: colours appear only after Check / when time runs out
  input.addEventListener("input", () => input.classList.remove("correct", "incorrect"));
  input.addEventListener("keydown", e => {
    if (e.key === "Enter"){
      e.preventDefault();
      const next = inputs[idx + 1];
      if (next) next.input.focus();
    }
  });

  row.appendChild(ru);
  row.appendChild(input);
  row.appendChild(reveal);
  quizEl.appendChild(row);
  inputs.push({ input, item });
});

function checkAll(){
  let count = 0;
  inputs.forEach(({ input, item }) => {
    const typed = normalize(input.value);
    if (typed === ""){
      input.classList.remove("correct", "incorrect");
      return;
    }
    const ok = item.answers.some(a => normalize(a) === typed);
    if (ok) count++;
    input.classList.toggle("correct", ok);
    input.classList.toggle("incorrect", !ok);
  });
  correctCount = count;
  document.getElementById("score").textContent = correctCount + " / " + data.length + " correct";
}

function formatTime(t){
  const m = Math.floor(t / 60).toString().padStart(2, "0");
  const s = (t % 60).toString().padStart(2, "0");
  return m + ":" + s;
}

function tick(){
  timeLeft--;
  const timerEl = document.getElementById("timer");
  timerEl.textContent = formatTime(Math.max(timeLeft, 0));
  if (timeLeft <= 10) timerEl.classList.add("warn");
  if (timeLeft <= 0){
    clearInterval(timerId);
    endQuiz();
  }
}

function endQuiz(){
  checkAll();
  // Unanswered fields are marked red at the end so students see what they missed
  inputs.forEach(({ input }) => {
    if (input.value.trim() === "") input.classList.add("incorrect");
    input.disabled = true;
  });
  document.getElementById("check-btn").disabled = true;

  const [emoji, message] = scoreMessages[correctCount] || scoreMessages[0];
  document.getElementById("finish-emoji").textContent = emoji;
  document.getElementById("finish-title").textContent = message;
  document.getElementById("final-score").textContent =
    "You got " + correctCount + " out of " + data.length + " correct.";
  document.getElementById("finish-overlay").style.display = "flex";
}

// Closing the pop-up keeps all answers in place and now reveals the correct answers
function closePopup(){
  document.getElementById("finish-overlay").style.display = "none";
  document.body.classList.add("show-answers");
}

function toggleTheme(){
  const html = document.documentElement;
  const btn = document.getElementById("theme-toggle");
  if (html.getAttribute("data-theme") === "light"){
    html.removeAttribute("data-theme");
    btn.textContent = "☀ Light";
  } else {
    html.setAttribute("data-theme", "light");
    btn.textContent = "🌙 Dark";
  }
}

timerId = setInterval(tick, 1000);
</script>
</body>
</html>
